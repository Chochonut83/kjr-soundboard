<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KJR Game Day Soundboard</title>
<meta name="theme-color" content="#0b2350">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KJR Sound">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ice:#f1f6fa;--ink:#0d1b33;--navy:#123a7a;--navy2:#0b2350;--red:#d3212c;--amber:#f4b223;--green:#1db954;--line:#d6e0ea;--muted:#5b6b82;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ice);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h2{font:800 26px/1.1 "Saira Condensed",sans-serif;margin:6px 0 10px;text-transform:uppercase;letter-spacing:.5px}
h3{font:800 22px/1.1 "Saira Condensed",sans-serif;margin:4px 0 8px;text-transform:uppercase}
h4{font:700 18px/1.1 "Saira Condensed",sans-serif;margin:0 0 8px;text-transform:uppercase;color:var(--navy)}
p{margin:6px 0 10px}
.muted{color:var(--muted)} .tiny{font-size:13px} .center{text-align:center} .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.row{display:flex}.row.gap{gap:8px}.row.center{align-items:center}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.pad{padding:12px}

/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;padding:calc(8px + var(--safe-t)) 14px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px #0b235044}
header img{width:46px;height:auto;filter:drop-shadow(0 1px 2px #0006)}
header .t1{font:800 20px/1 "Saira Condensed",sans-serif;letter-spacing:.6px;text-transform:uppercase}
header .t2{font:600 13px/1.2 Barlow,sans-serif;opacity:.8;letter-spacing:.3px}
.sync-dot{width:10px;height:10px;border-radius:50%;margin-left:auto;background:transparent}
.sync-dot.on{background:#3ddc84}.sync-dot.saving,.sync-dot.connecting{background:var(--amber)}.sync-dot.offline{background:#9aa7b8}.sync-dot.error{background:var(--red);box-shadow:0 0 0 2px #fff}

/* now playing */
.now{position:sticky;top:calc(62px + var(--safe-t));z-index:15;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:58px}
.now.idle{justify-content:space-between}
.now .art{width:42px;height:42px}
.nowtxt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowtxt small{color:var(--muted)}
.nbtn{border:0;border-radius:10px;padding:9px 11px;font-weight:700;background:#e7eef6;color:var(--navy2)}
.nbtn.stopb{background:var(--ink);color:#fff}
.nbtn:disabled{opacity:.6}
.devpill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devpill.warn{border-color:var(--amber);background:#fff6e0}

main{padding:12px 12px calc(86px + var(--safe-b));max-width:760px;margin:0 auto}

/* soundboard */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad-btn{border:0;border-radius:18px;color:#fff;min-height:118px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 4px 0 #0003,0 6px 14px #0b235022;transition:transform .06s;position:relative;overflow:hidden}
.pad-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}
.pad-btn .big{font:800 30px/1 "Saira Condensed",sans-serif;letter-spacing:1px}
.pad-btn small{font-size:13px;opacity:.9;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad-btn.goal{grid-column:1/-1;min-height:150px;background:linear-gradient(160deg,#e8323d,#a5121c)}
.pad-btn.goal .big{font-size:56px;letter-spacing:3px}
.pad-btn.penalty{background:linear-gradient(160deg,#f7c24a,#d48c00);color:#2a1d00}
.pad-btn.skate{background:linear-gradient(160deg,#2a63c4,#123a7a)}
.pad-btn.penalty .big,.pad-btn.skate .big{font-size:clamp(22px,7.4vw,32px);white-space:nowrap}
.pad-btn.inter{grid-column:1/-1;min-height:96px;background:linear-gradient(160deg,#21345a,#0b2350)}
.pad-btn.stop{min-height:110px}
.pad-btn.stop{grid-column:1/-1;background:linear-gradient(160deg,#ffffff,#dfe8f2);color:var(--navy2);border:3px solid var(--navy)}
.pad-btn.stop.queued small{background:var(--navy);color:#fff;border-radius:99px;padding:2px 10px;opacity:1}
.pad-btn.busy::after{content:"";position:absolute;inset:0;background:#fff3;animation:pulse .8s infinite alternate}
@keyframes pulse{from{opacity:.2}to{opacity:.8}}
.game-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;font-size:14px}
.game-foot .btn{white-space:nowrap;flex:none}

/* buttons, inputs */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:#e7eef6;color:var(--navy2);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.sm{padding:8px 10px;font-size:14px}
.btn.full{width:100%;margin-top:8px}
.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--navy);color:#fff}.btn.green{background:var(--green);color:#04260f}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5}
input:not([type]),input[type=text]{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-width:0}
input.time{width:88px;text-align:center;font:700 22px "Saira Condensed",sans-serif}
code.mono{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;word-break:break-all}
.lbl{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.banner{background:#0b2350;color:#fff;border-radius:16px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.banner span{opacity:.85;font-size:14px}

/* lists */
.list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:left;width:100%}
.item:disabled{opacity:.5}
.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none;background:#dfe8f2}
.art.blank{display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:20px}
.start{font:700 18px "Saira Condensed",sans-serif;color:var(--navy);background:#eef3f8;border-radius:8px;padding:2px 8px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:#e7eef6;color:var(--navy2)}
.c-goal.tag,.chip.c-goal.on{background:var(--red);color:#fff}
.c-penalty.tag,.chip.c-penalty.on{background:var(--amber);color:#2a1d00}
.c-skate.tag,.chip.c-skate.on{background:#2a63c4;color:#fff}
.c-inter.tag,.chip.c-inter.on{background:var(--navy2);color:#fff}
.c-stop.tag,.chip.c-stop.on{background:#5b6b82;color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:transparent}
.cnt{opacity:.7;font-weight:500;margin-left:2px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);text-align:center}
.play-ico,.qcount{font-weight:800;color:var(--navy);min-width:28px;text-align:center}
.item.q.done{opacity:.55}
.item.q.next{border:2px solid var(--navy)}
.qn{font:800 18px "Saira Condensed",sans-serif;color:var(--navy);min-width:20px;text-align:center}
.qbtns{display:flex;gap:4px}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;font-size:12px;color:var(--navy2)}
.mini:disabled{opacity:.3}.mini.x{color:var(--red)}
.dev-ico{font-size:22px}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b))}
.tab{flex:1;border:0;background:none;padding:6px 2px;border-radius:12px;font-weight:700;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab span{font-size:20px;line-height:1}
.tab.on{color:var(--navy2);background:#e7eef6}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:#0b235066;opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--ice);border-radius:20px 20px 0 0;padding:8px 16px calc(16px + var(--safe-b));transform:translateY(100%);transition:transform .22s ease-out;max-width:760px;margin:0 auto}
.sheet-wrap.open .sheet{transform:none}.sheet-wrap.open .sheet-bg{opacity:1}
.grab{width:44px;height:5px;border-radius:9px;background:#c5d2df;margin:4px auto 10px}
.ed-head{display:flex;gap:10px;align-items:center}
.ed-head small{display:block;color:var(--muted)}
.sheet .row.gap{margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:.2s;z-index:60;font-weight:600;font-size:15px;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--red)}.toast.ok{background:#178a4c}
</style>
</head>
<body>
<header>
  <img src="logo-240.png" alt="Kitchener Jr Rangers">
  <div><div class="t1">Kitchener Jr Rangers</div><div class="t2">Game Day Soundboard</div></div>
  <span id="syncDot" class="sync-dot off"></span>
</header>
<div id="now" class="now idle"></div>
<main id="main"></main>
<nav>
  <button class="tab on" data-view="game"><span>🏒</span>Game</button>
  <button class="tab" data-view="songs"><span>🎵</span>Songs</button>
  <button class="tab" data-view="queue"><span>📋</span>Queue</button>
  <button class="tab" data-view="settings"><span>⚙️</span>Settings</button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="app.js"></script>
<script type="module" src="firebase-glue.js"></script>
</body>
</html>
